<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quant Lab</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--card:#121212;--ink:#ededed;--mut:#8a8a8a;--line:#262626;--soft:#1b1b1b;--red:#ef6a5b;--grn:#4cc38a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;max-width:1280px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:18px 14px 16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.mark{width:36px;height:36px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 13px ui-monospace,monospace;flex:none}
h1{font-size:20px;margin:0;letter-spacing:-.4px;line-height:1.1}
.tag{color:var(--mut);margin:2px 0 0;font:11px ui-monospace,monospace}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tabs button{min-height:44px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;padding:6px 8px;cursor:pointer;font:600 11px/1.15 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
.tabs button small{display:block;margin-top:2px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.75}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.blurb{color:var(--mut);font-size:12px;margin:0 0 10px;line-height:1.35}
#idx{display:flex;flex-direction:column;gap:4px}
.aside-note{color:var(--mut);font-size:11px;line-height:1.45;margin:14px 0 0}
.pill{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px}
.cnt{font:12px ui-monospace,monospace;color:var(--mut);margin-left:8px}
.sub{color:var(--mut);margin:0 0 18px}
.lbl{font:700 11px ui-monospace,monospace;letter-spacing:.15em;color:var(--mut);margin-bottom:8px}
.crumb{font:600 11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.item{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:var(--soft)}.item.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.item .n{font:11px ui-monospace,monospace;color:var(--mut);width:1.7em;flex:none}
.item .nm{font-size:13.5px;font-weight:650}
.badge{font:700 9px ui-monospace,monospace;letter-spacing:.06em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
main{padding:28px 32px 48px;min-width:0}
main h2{margin:0 0 4px;font-size:22px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px;background:var(--card)}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd b{font-size:18px}.hd .s{color:var(--mut);font-size:13px;flex-basis:100%;margin-top:-8px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label{display:flex;flex-direction:column;font:600 11px ui-monospace,monospace;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;gap:4px}
input,select,textarea{font:14px ui-monospace,monospace;border:1px solid #3a3a3a;border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink);width:110px}
input:disabled{background:var(--soft);color:#666}
textarea{width:100%;min-height:86px;resize:vertical}
input[type=range]{padding:0;width:200px;accent-color:#ededed}
.seg{display:inline-flex;border:1px solid #3a3a3a;border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 14px;font:14px inherit;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:1px solid #3a3a3a;background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:13px inherit;cursor:pointer}
.pills button.on{background:var(--ink);color:var(--bg)}
.btn{border:1px solid #3a3a3a;background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:13px inherit;cursor:pointer}.btn:hover{background:var(--soft)}
.btn.w{background:var(--ink);color:var(--bg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.stat .k{font:600 11px ui-monospace,monospace;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.stat .v{font:700 22px ui-monospace,monospace;margin:2px 0}
.stat .h{font-size:12px;color:var(--mut)}
.stat.big{background:var(--ink);color:var(--bg)}.stat.big .k,.stat.big .h{color:#555}.stat.big .v{font-size:32px}
.two{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start;margin-top:14px}
.two .grid{grid-template-columns:1fr 1fr;margin-top:0}
.two h4{margin:0 0 4px;font:600 11px ui-monospace,monospace;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.nt{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px;color:var(--mut);font-size:13px}
.nt p{margin:0 0 8px}.nt p:last-child{margin:0}.nt b{color:var(--ink)}
.neg{color:var(--red)}.pos{color:var(--grn)}
.err{border:1px solid var(--red);color:var(--red);background:#2a1210;border-radius:10px;padding:12px;margin-top:14px;font-weight:600}
.note{color:var(--mut);font-size:13px;margin-top:14px}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;margin-top:2px}
svg{width:100%;height:auto;display:block}svg [fill="#777"],svg [fill="#555"]{fill:#8a8a8a}svg [stroke="#eee"]{stroke:#222}svg [stroke="#111"]{stroke:#f2f2f2}svg [stroke="#555"],svg [stroke="#888"]{stroke:#777}svg circle{stroke:#0b0b0b}svg circle[fill="#111"]{fill:#f2f2f2}
table{width:100%;border-collapse:collapse;font:14px ui-monospace,monospace}
td,th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:11px}td:last-child,th:last-child{text-align:right}
.leg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.leg select{width:auto}.leg input{width:80px}
@media(max-width:820px){
.app{grid-template-columns:1fr}
aside{position:sticky;top:0;z-index:5;max-height:none;border-right:0;border-bottom:1px solid var(--line);background:rgba(11,11,11,.94);backdrop-filter:blur(12px);padding:10px 12px 8px}
.brand{margin-bottom:8px}.aside-note,.blurb{display:none}
#idx{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
.item{width:auto;white-space:nowrap;flex:none}
main{padding:16px 14px 48px}.two{grid-template-columns:1fr}
}
</style></head><body>
<div class="app"><aside>
<div class="brand"><div class="mark">QL</div><div><h1>Quant Lab</h1><p class="tag">Synthetic book loaded</p></div></div>
<div class="tabs" id="tabs"></div>
<p class="blurb" id="blurb"></p>
<nav id="idx"></nav>
<p class="aside-note">Every tool opens on a worked example. Replace the inputs with your own numbers. Educational only, not investment advice.</p>
</aside>
<main id="main"></main></div>
<script>
const $=s=>document.querySelector(s), N=x=>x;

const pdf=x=>.3989422804014327*Math.exp(-x*x/2);
function num(id,name,o={}){const v=parseFloat($('#'+id).value);if(!isFinite(v))throw Error(name+': enter a valid number');if(o.min!==undefined&&v<o.min)throw Error(name+' must be ≥ '+o.min);if(o.gt!==undefined&&v<=o.gt)throw Error(name+' must be > '+o.gt);if(o.max!==undefined&&v>o.max)throw Error(name+' must be ≤ '+o.max);return v}
const sv=id=>$('#'+id).dataset.v;
const inp=(id,l,v,ex='')=>`<label>${l}<input id="${id}" value="${v}" inputmode="decimal" ${ex}></label>`;
const seg=(id,opts,d)=>`<div class="seg" id="${id}" data-v="${d}">${opts.map(o=>`<button type="button" data-v="${o}" class="${o==d?'on':''}">${o}</button>`).join('')}</div>`;
const pills=(id,opts,d)=>`<div class="pills seg-p" id="${id}" data-v="${d}">${opts.map(o=>`<button type="button" data-v="${o}" class="${o==d?'on':''}">${o}</button>`).join('')}</div>`;
const tf=v=>{const a=Math.abs(v);return a>=1000?v.toFixed(0):a>=100?v.toFixed(0):a>=10?v.toFixed(1):a>=1?v.toFixed(2):v.toFixed(3)};
function bs(type,S,K,T,r,q,v){if(T<=0||v<=0)throw Error('Time and volatility must be > 0');const sq=Math.sqrt(T),d1=(Math.log(S/K)+(r-q+v*v/2)*T)/(v*sq),d2=d1-v*sq,eq=Math.exp(-q*T),er=Math.exp(-r*T),c=type==='Call';
 const price=c?S*eq*cdf(d1)-K*er*cdf(d2):K*er*cdf(-d2)-S*eq*cdf(-d1);
 const delta=c?eq*cdf(d1):-eq*cdf(-d1),gamma=eq*pdf(d1)/(S*v*sq),vega=S*eq*pdf(d1)*sq/100;
 const th=-S*eq*pdf(d1)*v/(2*sq)+(c?(-r*K*er*cdf(d2)+q*S*eq*cdf(d1)):(r*K*er*cdf(-d2)-q*S*eq*cdf(-d1)));
 const rho=(c?K*T*er*cdf(d2):-K*T*er*cdf(-d2))/100;return{price,delta,gamma,vega,theta:th/365,rho}}
function chart(o){if(!(o.x1>o.x0))o={...o,x1:o.x0+1};if(!(o.y1>o.y0))o={...o,y1:o.y0+1};const W=700,H=300,m={l:54,r:16,t:18,b:38},sx=x=>m.l+(x-o.x0)/(o.x1-o.x0)*(W-m.l-m.r),sy=y=>H-m.b-(y-o.y0)/(o.y1-o.y0)*(H-m.t-m.b),xf=o.xf||tf,yf=o.yf||tf;let s=`<svg viewBox="0 0 ${W} ${H}" font-family="ui-monospace,monospace" font-size="10">`;
 for(let i=0;i<=4;i++){const y=o.y0+(o.y1-o.y0)*i/4,x=o.x0+(o.x1-o.x0)*i/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="#eee"/><text x="${m.l-6}" y="${sy(y)+3}" text-anchor="end" fill="#777">${yf(y)}</text><text x="${sx(x)}" y="${H-m.b+14}" text-anchor="middle" fill="#777">${xf(x)}</text>`}
 s+=`<text x="${(W+m.l)/2}" y="${H-4}" text-anchor="middle" fill="#555">${o.xl||''}</text><text transform="translate(11 ${H/2}) rotate(-90)" text-anchor="middle" fill="#555">${o.yl||''}</text>`;
 (o.h||[]).forEach(h=>{if(h.y>=o.y0&&h.y<=o.y1)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${sy(h.y)}" y2="${sy(h.y)}" stroke="${h.c||'#999'}" stroke-dasharray="${h.d||''}"/>${h.t?`<text x="${W-m.r-2}" y="${sy(h.y)-4}" text-anchor="end" fill="${h.c||'#999'}">${h.t}</text>`:''}`});
 (o.v||[]).forEach(v=>{if(v.x>=o.x0&&v.x<=o.x1)s+=`<line x1="${sx(v.x)}" x2="${sx(v.x)}" y1="${m.t}" y2="${H-m.b}" stroke="${v.c||'#999'}" stroke-dasharray="${v.d||'4 3'}"/><text x="${sx(v.x)+3}" y="${m.t+9}" fill="${v.c||'#777'}">${v.t||''}</text>`});
 o.s.forEach(se=>{const pts=se.p.filter(p=>isFinite(p[1])).map(p=>`${sx(p[0]).toFixed(1)},${sy(Math.max(o.y0,Math.min(o.y1,p[1]))).toFixed(1)}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${se.c||'#111'}" stroke-opacity="${se.o||1}" stroke-width="${se.w||2}" stroke-dasharray="${se.d||''}"/>`});
 (o.dots||[]).forEach(d=>s+=`<circle cx="${sx(d[0])}" cy="${sy(d[1])}" r="4.5" fill="${d[2]||'#111'}" stroke="#fff" stroke-width="1.5"/>${d[3]?`<text x="${sx(d[0])-9}" y="${sy(d[1])+4}" text-anchor="end" font-weight="700" fill="${d[2]||'#777'}">${d[3]}</text>`:''}`);
 (o.star||[]).forEach(d=>s+=`<text x="${sx(d[0])}" y="${sy(d[1])+5}" text-anchor="middle" font-size="15" fill="#f2f2f2">★</text>`);
 if(o.leg)s+=o.leg.map((l,i)=>`<g transform="translate(${m.l+10+i*130} ${H-m.b-8})"><line x2="18" stroke="#111" stroke-width="2" stroke-dasharray="${l[1]}"/><text x="24" y="3" fill="#555">${l[0]}</text></g>`).join('');
 return s+'</svg>'}
const rg=(a,b,n,f)=>Array.from({length:n+1},(_,i)=>{const x=a+(b-a)*i/n;return[x,f(x)]});

const sg=v=>(v>=0?'+':'')+v;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}

const pc=(a,p)=>{const i=(a.length-1)*p,l=Math.floor(i);return a[l]+(a[Math.min(l+1,a.length-1)]-a[l])*(i-l)};
function hist(a,n,lo,hi){const c=Array(n).fill(0);if(!(hi>lo))return c;a.forEach(x=>{if(x>=lo&&x<=hi)c[Math.min(n-1,Math.floor((x-lo)/(hi-lo)*n))]++});return c}
function bars(v,x0,x1,o={}){const W=700,H=250,m={l:44,r:14,t:14,b:30},cv=o.curve?v.map((_,i)=>o.curve(x0+(x1-x0)*(i+.5)/v.length)):[],mx=Math.max(...v,...cv,1e-9)*1.05,bw=(W-m.l-m.r)/v.length,sy=y=>H-m.b-y/mx*(H-m.t-m.b),xf=o.xf||tf;
 let s=`<svg viewBox="0 0 ${W} ${H}" font-family="ui-monospace,monospace" font-size="10">`;
 for(let i=0;i<=4;i++){const y=mx*i/4,x=x0+(x1-x0)*i/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${sy(y)}" y2="${sy(y)}" stroke="#eee"/><text x="${m.l-6}" y="${sy(y)+3}" text-anchor="end" fill="#777">${o.yf?o.yf(y):y.toFixed(0)}</text><text x="${m.l+(W-m.l-m.r)*i/4}" y="${H-m.b+14}" text-anchor="middle" fill="#777">${xf(x)}</text>`}
 v.forEach((c,i)=>{const xm=x0+(x1-x0)*(i+.5)/v.length;s+=`<rect x="${m.l+i*bw+1}" y="${sy(c)}" width="${Math.max(bw-2,1)}" height="${H-m.b-sy(c)}" fill="${o.cut!==undefined&&xm<o.cut?'#4a4a4a':'#ededed'}"/>`});
 if(o.mk!==undefined&&o.mk>=x0&&o.mk<=x1){const X=m.l+(o.mk-x0)/(x1-x0)*(W-m.l-m.r);s+=`<line x1="${X}" x2="${X}" y1="${m.t}" y2="${H-m.b}" stroke="#999" stroke-dasharray="3 3"/><text x="${X}" y="${m.t-3}" text-anchor="middle" fill="#8a8a8a">start</text>`}
 if(o.curve)s+=`<polyline fill="none" stroke="#ef6a5b" stroke-width="2" points="${cv.map((c,i)=>`${m.l+(i+.5)*bw},${sy(c)}`).join(' ')}"/>`;
 return s+`<text x="${(W+m.l)/2}" y="${H-2}" text-anchor="middle" fill="#8a8a8a">${o.xl||''}</text></svg>`}
const tools=[
{id:'bs',name:'Black-Scholes & Greeks',badge:'LIVE GREEKS',desc:'Price a European option and see all its greeks update live, with a chart of value and delta versus the underlying price.',
 html:()=>`<div class="card"><div class="row"><label>Type${seg('bs_t',['Call','Put'],'Call')}</label>${inp('bs_S','Spot (S)',100)}${inp('bs_K','Strike (K)',100)}${inp('bs_T','Time (yrs)',1)}${inp('bs_r','Rate r %',5)}${inp('bs_v','Vol σ %',20)}${inp('bs_q','Div q %',0)}</div><div id="o"></div></div>`,
 run(){const t=sv('bs_t'),S=num('bs_S','Spot',{gt:0}),K=num('bs_K','Strike',{gt:0}),T=num('bs_T','Time',{gt:0}),r=num('bs_r','Rate')/100,v=num('bs_v','Vol',{gt:0})/100,q=num('bs_q','Dividend')/100;
  const g=bs(t,S,K,T,r,q,v),f=s=>bs(t,s,K,T,r,q,v);const ex=Math.exp(-r*T);
  const intr=s=>t==='Call'?Math.max(s-K*ex,0):Math.max(K*ex-s,0);const a=S*.5,b=S*1.5,pts=rg(a,b,120,f),ymax=Math.max(...pts.map(p=>p[1]))*1.05;
  $('#o').innerHTML=`<div class="grid">${st(t.toUpperCase()+' FAIR VALUE','$'+g.price.toFixed(3),`per share, at S = ${S} and ${(v*100).toFixed(1)}% volatility`,'big')}${st('Delta',g.delta.toFixed(4),'≈ price move per $1 move in the underlying')}${st('Gamma',g.gamma.toFixed(4),'how fast Delta changes as the underlying moves')}${st('Vega',g.vega.toFixed(4),'price change per 1-pt rise in volatility')}${st('Theta',g.theta.toFixed(4),'value lost each day as time passes')}${st('Rho',g.rho.toFixed(4),'price change per 1% rise in rate')}</div>
  <h3>Option value vs. spot price</h3>${chart({x0:a,x1:b,y0:0,y1:ymax,s:[{p:rg(a,b,120,intr),d:'5 4',c:'#888'},{p:pts}],v:[{x:S,t:'spot'}],xl:'Spot price',yl:'Option value',leg:[['Option value',''],['Intrinsic (disc.)','5 4']]})}
  <h3>Delta vs. spot price</h3>${chart({x0:a,x1:b,y0:t==='Call'?0:-1,y1:t==='Call'?1:0,s:[{p:rg(a,b,120,s=>bs(t,s,K,T,r,q,v).delta)}],v:[{x:S,t:'spot'}],xl:'Spot price',yl:'Delta'})}
  <p class="note">The smooth curve is the Black-Scholes value; the dashed line is intrinsic value (discounted strike). The gap is time value. The model assumes constant volatility and lognormal prices; real markets drift from it.</p>`}},
{id:'kelly',name:'Kelly Criterion Calculator',desc:'Find the bet size that grows your bankroll fastest, and see exactly why betting more than that quietly destroys it.',
 html:()=>`<div class="card"><div class="row"><label>Win probability<input type="range" id="k_ps" min="1" max="99" value="55"></label>${inp('k_p','%',55)}${inp('k_b','Payoff odds b',1)}<span class="h" style="color:var(--mut);font-size:13px">net won per 1 staked</span></div><div id="o"></div></div>`,
 run(){const ps=$('#k_ps'),pi=$('#k_p');if(document.activeElement===ps)pi.value=ps.value;else{const v=parseFloat(pi.value);if(isFinite(v)&&v>=1&&v<=99)ps.value=v}
  const p=num('k_p','Win probability',{min:.01,max:99.99})/100,b=num('k_b','Odds b',{gt:0}),q=1-p,fs=(b*p-q)/b,fk=Math.max(0,fs),g=f=>p*Math.log(1+b*f)+q*Math.log(1-f),gs=g(fk);
  let xMax=30;if(fs>0){for(let x=Math.max(1,Math.ceil(fk*100));x<=99;x++){const val=g(Math.min(x,99)/100);xMax=x;if(!isFinite(val)||val<gs-Math.max(.02,Math.abs(gs)*2))break}xMax=Math.min(99,Math.max(xMax,Math.min(99,fk*100+8)))}

  const finite=growPts.map(p=>p[1]).filter(y=>isFinite(y)&&y>-12);

run(){const S=num('m_s','Start',{gt:0}),mu=num('m_m','Drift')/100,sg=num('m_v','Vol',{gt:0})/100,T=num('m_T','Horizon',{gt:0}),n=Math.round(num('m_n','Steps',{min:1,max:500})),P=Math.round(num('m_p','Paths',{min:2,max:5000}));
 if(this.F||!this.Z||this.Z.length!==P||this.Z[0].length!==n){reseed(this.seed||0x4D430001);this.Z=Array.from({length:P},()=>Array.from({length:n},randn));this.F=0}

 const end=paths.map(p=>p[n]).sort((a,b)=>a-b),all=paths.flat(),lo=Math.min(...all)*.95,hi=Math.max(...all)*1.05,sh=paths.slice(0,80).map(p=>({p:p.map((y,i)=>[i*dt,y]),c:'#9a9a9a',w:.7,o:.45}));
